name: Build
on:
  push:
    branches:
      - docker
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build
        run: npm intsall
      - name: Run tests
        run: npm test || echo "No tests defined here"
  
    
